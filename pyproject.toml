[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "archit"
version = "v2026.04.01"
description = "ArchIt: A framework for base-and-head language models, and toolkit for converting in-place modifications of PyTorch objects into class code."
keywords = ["PyTorch", "machine learning"]

requires-python = ">= 3.9"
authors = [
  {name = "Thomas Bauwens", email = "thomas.bauwens@kuleuven.be"}
]
maintainers = [
  {name = "Thomas Bauwens", email = "thomas.bauwens@kuleuven.be"}
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
    "transformers"
]

[project.optional-dependencies]
all = [
    "supar_bauwenst"
]

[project.urls]
Source = "https://github.com/bauwenst/ArchIt"
Issues = "https://github.com/bauwenst/ArchIt/issues"
